<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sentinel — Live Dashboard</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22273a;
    --border: #2e3347;
    --text: #e2e8f0;
    --muted: #64748b;
    --accent: #38bdf8;
    --green: #22c55e;
    --yellow: #f59e0b;
    --orange: #f97316;
    --red: #ef4444;
    --red-bg: rgba(239,68,68,0.08);
    --green-bg: rgba(34,197,94,0.08);
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f1f5f9;
      --surface: #ffffff;
      --surface2: #f8fafc;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
    background: var(--bg);
    color: var(--text);
    font-size: 13px;
    line-height: 1.5;
    min-height: 100vh;
  }
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  header h1 {
    font-size: 16px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 0.05em;
  }
  header .subtitle { color: var(--muted); font-size: 12px; }
  .ws-status {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: var(--muted);
  }
  .ws-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--muted);
    transition: background 0.3s;
  }
  .ws-dot.connected { background: var(--green); }
  .ws-dot.connecting { background: var(--yellow); }
  .ws-dot.error { background: var(--red); }
  .scan-time { color: var(--muted); font-size: 11px; }
  button {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 5px 12px;
    border-radius: 4px;
    cursor: pointer;
    font-family: inherit;
    font-size: 12px;
    transition: background 0.15s;
  }
  button:hover { background: var(--border); }
  button:active { transform: scale(0.97); }
  main { padding: 20px 24px; max-width: 1400px; margin: 0 auto; }

  /* Stat cards */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 20px;
  }
  @media (max-width: 800px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 480px) { .stats-grid { grid-template-columns: 1fr; } }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    text-align: center;
    transition: border-color 0.3s;
  }
  .stat-card.has-findings { border-color: var(--red); background: var(--red-bg); }
  .stat-card.all-clear { border-color: var(--green); background: var(--green-bg); }
  .stat-card .stat-label {
    font-size: 10px;
    letter-spacing: 0.12em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .stat-card .stat-value {
    font-size: 32px;
    font-weight: 700;
    color: var(--accent);
    line-height: 1;
  }
  .stat-card.has-findings .stat-value { color: var(--red); }
  .stat-card.all-clear .stat-value { color: var(--green); }

  /* Two-column layout */
  .main-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  @media (max-width: 900px) { .main-grid { grid-template-columns: 1fr; } }
  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  .panel-header {
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .panel-header .badge {
    margin-left: auto;
    background: var(--surface2);
    border: 1px solid var(--border);
    padding: 1px 7px;
    border-radius: 10px;
    font-size: 10px;
  }
  .panel-body { padding: 12px 16px; }

  /* Findings */
  .finding-item {
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .finding-item:last-child { border-bottom: none; }
  .finding-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 600;
    margin-bottom: 3px;
  }
  .severity-badge {
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 3px;
    font-weight: 700;
    letter-spacing: 0.05em;
  }
  .sev-critical { background: rgba(239,68,68,0.2); color: var(--red); }
  .sev-high { background: rgba(239,68,68,0.12); color: #f87171; }
  .sev-medium { background: rgba(249,115,22,0.15); color: var(--orange); }
  .sev-low { background: rgba(245,158,11,0.15); color: var(--yellow); }
  .finding-subject { color: var(--muted); font-size: 12px; }
  .finding-reason {
    color: var(--muted);
    font-size: 11px;
    padding-left: 12px;
    margin-top: 2px;
  }
  .finding-reason::before { content: "› "; }
  .all-clear-msg {
    color: var(--green);
    text-align: center;
    padding: 24px 0;
    font-size: 14px;
  }

  /* Ports table */
  .ports-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
  }
  .ports-table th {
    text-align: left;
    color: var(--muted);
    font-weight: 600;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 4px 8px;
    border-bottom: 1px solid var(--border);
  }
  .ports-table td {
    padding: 5px 8px;
    border-bottom: 1px solid var(--border);
  }
  .ports-table tr:last-child td { border-bottom: none; }
  .ports-table tr:hover td { background: var(--surface2); }
  .exp-all { color: var(--red); font-weight: 600; }
  .exp-local { color: var(--yellow); }
  .exp-loop { color: var(--green); }
  .flag { width: 18px; text-align: center; }

  /* Activity log */
  #activity-log {
    height: 300px;
    overflow-y: auto;
    font-size: 11px;
    font-family: inherit;
    padding: 0;
  }
  .log-entry {
    padding: 3px 0;
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 8px;
    animation: fadeIn 0.2s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(-2px); } to { opacity: 1; } }
  .log-ts { color: var(--muted); white-space: nowrap; flex-shrink: 0; }
  .log-type {
    flex-shrink: 0;
    width: 120px;
    font-size: 10px;
    color: var(--accent);
  }
  .log-msg { color: var(--text); word-break: break-all; }

  .empty-msg { color: var(--muted); padding: 20px 0; text-align: center; font-size: 12px; }

  /* Scrollbar styling */
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>
<header>
  <h1>⬡ SENTINEL</h1>
  <span class="subtitle">Local Security Monitor</span>
  <span class="scan-time" id="scan-time">—</span>
  <button onclick="refresh()">↺ Scan</button>
  <div class="ws-status">
    <div class="ws-dot connecting" id="ws-dot"></div>
    <span id="ws-label">connecting…</span>
  </div>
</header>

<main>
  <div class="stats-grid">
    <div class="stat-card" id="card-processes">
      <div class="stat-label">⬤ Processes</div>
      <div class="stat-value" id="val-processes">—</div>
    </div>
    <div class="stat-card" id="card-ports">
      <div class="stat-label">◆ Ports</div>
      <div class="stat-value" id="val-ports">—</div>
    </div>
    <div class="stat-card" id="card-connections">
      <div class="stat-label">⇄ Connections</div>
      <div class="stat-value" id="val-connections">—</div>
    </div>
    <div class="stat-card" id="card-attention">
      <div class="stat-label">● Attention</div>
      <div class="stat-value" id="val-attention">—</div>
    </div>
  </div>

  <div class="main-grid">
    <div class="panel">
      <div class="panel-header">
        ⚠ Needs Attention
        <span class="badge" id="findings-count">0</span>
      </div>
      <div class="panel-body" id="findings-body">
        <div class="empty-msg">Run a scan to see findings</div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header">
        ◆ Listening Ports
        <span class="badge" id="ports-count">0</span>
      </div>
      <div class="panel-body" style="padding:0">
        <div id="ports-body" style="overflow-x:auto">
          <div class="empty-msg">Run a scan to see ports</div>
        </div>
      </div>
    </div>

    <div class="panel" style="grid-column: 1 / -1">
      <div class="panel-header">
        ● Live Activity
        <span class="badge" id="activity-count">0</span>
      </div>
      <div class="panel-body" style="padding:8px 16px">
        <div id="activity-log">
          <div class="empty-msg">Waiting for events…</div>
        </div>
      </div>
    </div>
  </div>
</main>

<script>
  const WS_URL = `ws://${location.host}/events`;
  const SCAN_URL = `/scan`;
  let ws = null;
  let activityCount = 0;
  const MAX_LOG_ENTRIES = 200;

  // ── WebSocket ────────────────────────────────────────────────────────────────

  function connectWS() {
    setWsStatus('connecting');
    ws = new WebSocket(WS_URL);

    ws.onopen = () => {
      setWsStatus('connected');
    };

    ws.onmessage = (e) => {
      try {
        const msg = JSON.parse(e.data);
        if (msg.type === 'ping') return;
        appendActivity(msg);
        // Re-fetch scan data on process/network events
        if (msg.event_type && (
          msg.event_type.includes('PROCESS') ||
          msg.event_type.includes('CONNECTION') ||
          msg.event_type.includes('PORT')
        )) {
          refresh();
        }
      } catch (_) {}
    };

    ws.onerror = () => setWsStatus('error');

    ws.onclose = () => {
      setWsStatus('error');
      // Reconnect after 3s
      setTimeout(connectWS, 3000);
    };
  }

  function setWsStatus(state) {
    const dot = document.getElementById('ws-dot');
    const label = document.getElementById('ws-label');
    dot.className = 'ws-dot ' + state;
    label.textContent = state === 'connected' ? 'live' : state === 'connecting' ? 'connecting…' : 'reconnecting…';
  }

  // ── Scan data ────────────────────────────────────────────────────────────────

  async function refresh() {
    try {
      const res = await fetch(SCAN_URL);
      if (!res.ok) return;
      const data = await res.json();
      renderScan(data);
    } catch (_) {}
  }

  function renderScan(data) {
    // Stat cards
    setStatCard('processes', data.process_count ?? '—', false);
    setStatCard('ports', data.listener_count ?? '—', false);
    setStatCard('connections', data.connection_count ?? '—', false);
    const attn = data.attention_count ?? 0;
    setStatCard('attention', attn, true, attn > 0 ? 'has-findings' : 'all-clear');

    // Scan time
    if (data.scan_time) {
      const t = new Date(data.scan_time);
      document.getElementById('scan-time').textContent =
        'Last scan: ' + t.toLocaleTimeString();
    }

    // Findings
    renderFindings(data.findings || []);

    // Ports (from findings we can get listener info; full port list needs /scan extension)
    renderFindings(data.findings || []);
  }

  function setStatCard(name, value, special, cls) {
    document.getElementById('val-' + name).textContent = value;
    const card = document.getElementById('card-' + name);
    card.classList.remove('has-findings', 'all-clear');
    if (cls) card.classList.add(cls);
  }

  function renderFindings(findings) {
    const body = document.getElementById('findings-body');
    const badge = document.getElementById('findings-count');
    badge.textContent = findings.length;

    if (findings.length === 0) {
      body.innerHTML = '<div class="all-clear-msg">✓ All clear — no issues detected</div>';
      return;
    }

    const SEV_ORDER = ['critical', 'high', 'medium', 'low'];
    findings.sort((a, b) =>
      SEV_ORDER.indexOf(a.severity) - SEV_ORDER.indexOf(b.severity)
    );

    body.innerHTML = findings.map(f => {
      const sev = (f.severity || '').toLowerCase();
      const reasons = (f.reasons || []).slice(0, 2).map(r =>
        `<div class="finding-reason">${escHtml(r.description || r)}</div>`
      ).join('');
      return `
        <div class="finding-item">
          <div class="finding-title">
            <span class="severity-badge sev-${sev}">${sev.toUpperCase()}</span>
            ${escHtml(f.title || '')}
          </div>
          <div class="finding-subject">${escHtml(f.subject || '')}</div>
          ${reasons}
        </div>`;
    }).join('');
  }

  // ── Activity log ─────────────────────────────────────────────────────────────

  function appendActivity(msg) {
    const log = document.getElementById('activity-log');
    // Remove empty state
    const empty = log.querySelector('.empty-msg');
    if (empty) empty.remove();

    const ts = msg.timestamp
      ? new Date(msg.timestamp).toLocaleTimeString()
      : new Date().toLocaleTimeString();

    const payload = msg.payload || {};
    let text = '';
    if (payload.name) text += payload.name;
    if (payload.pid) text += ` (${payload.pid})`;
    if (payload.remote_address) text += ` → ${payload.remote_address}`;
    if (!text && msg.event_type) text = JSON.stringify(payload).slice(0, 80);

    const entry = document.createElement('div');
    entry.className = 'log-entry';
    entry.innerHTML = `
      <span class="log-ts">${escHtml(ts)}</span>
      <span class="log-type">${escHtml(msg.event_type || 'EVENT')}</span>
      <span class="log-msg">${escHtml(text)}</span>`;
    log.insertBefore(entry, log.firstChild);

    activityCount++;
    document.getElementById('activity-count').textContent = activityCount;

    // Trim old entries
    const entries = log.querySelectorAll('.log-entry');
    if (entries.length > MAX_LOG_ENTRIES) {
      entries[entries.length - 1].remove();
    }
  }

  // ── Helpers ──────────────────────────────────────────────────────────────────

  function escHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // ── Boot ─────────────────────────────────────────────────────────────────────

  connectWS();
  refresh();
  // Auto-refresh every 30s
  setInterval(refresh, 30000);
</script>
</body>
</html>
