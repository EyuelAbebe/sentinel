name: Release — Create RC

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        type: choice
        options: [patch, minor, major]
        default: minor

permissions:
  contents: write
  pull-requests: write

jobs:
  create-rc:
    name: Test and tag ${{ inputs.bump }} RC
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache virtual environment
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-3.12-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction --all-extras

      - name: Lint
        run: poetry run ruff check src/ tests/

      - name: Format check
        run: poetry run ruff format --check src/ tests/

      - name: Type check
        run: poetry run mypy

      - name: Tests
        run: poetry run pytest --tb=short -q

      - name: Bump version
        run: poetry version ${{ inputs.bump }}

      - name: Get new version
        id: ver
        run: echo "VERSION=$(poetry version -s)" >> "$GITHUB_OUTPUT"

      - name: Determine RC number
        id: rc
        run: |
          VERSION="${{ steps.ver.outputs.VERSION }}"
          LAST=$(git tag --list "v${VERSION}-rc.*" | sort -V | tail -1)
          if [ -z "$LAST" ]; then
            N=1
          else
            N=$(echo "$LAST" | sed 's/.*rc\.\([0-9]*\)$/\1/')
            N=$((N + 1))
          fi
          echo "RC_TAG=v${VERSION}-rc.${N}" >> "$GITHUB_OUTPUT"

      - name: Create version-bump branch and PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="chore/bump-version-${{ steps.ver.outputs.VERSION }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add pyproject.toml poetry.lock
          git commit -m "bump version to ${{ steps.ver.outputs.VERSION }}"
          git push origin "$BRANCH"
          PR_URL=$(gh pr create \
            --title "chore: bump version to ${{ steps.ver.outputs.VERSION }}" \
            --body "Automated version bump for ${{ steps.rc.outputs.RC_TAG }}." \
            --base main \
            --head "$BRANCH")
          echo "PR_URL=$PR_URL" >> "$GITHUB_OUTPUT"
          echo "BRANCH=$BRANCH" >> "$GITHUB_OUTPUT"
        id: bump_pr

      - name: Wait for PR checks and merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_URL="${{ steps.bump_pr.outputs.PR_URL }}"
          PR_NUM=$(echo "$PR_URL" | grep -o '[0-9]*$')
          echo "Waiting for checks on PR #$PR_NUM…"
          for i in $(seq 1 20); do
            sleep 30
            STATUS=$(gh pr view "$PR_NUM" --json statusCheckRollup \
              --jq '[.statusCheckRollup[].status] | unique | join(",")' 2>/dev/null || echo "pending")
            echo "  check $i: $STATUS"
            if echo "$STATUS" | grep -q "COMPLETED\|SUCCESS\|pass" && ! echo "$STATUS" | grep -q "QUEUED\|IN_PROGRESS\|pending"; then
              break
            fi
          done
          gh pr merge "$PR_NUM" --squash --delete-branch

      - name: Create and push RC tag
        run: |
          git fetch origin main
          git checkout main
          git pull origin main
          git tag -a "${{ steps.rc.outputs.RC_TAG }}" \
            -m "${{ steps.rc.outputs.RC_TAG }} — release candidate"
          git push origin "${{ steps.rc.outputs.RC_TAG }}"
          echo "Created ${{ steps.rc.outputs.RC_TAG }}"
